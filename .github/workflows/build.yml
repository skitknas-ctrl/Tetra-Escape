name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon test assembleDebug

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tetra-escape-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tetra-escape-debug
          path: tetra-escape-debug.apk

      # Rolling pre-release "testbuild": always the latest APK from main, with a stable download URL:
      # https://github.com/${{ github.repository }}/releases/download/testbuild/tetra-escape-debug.apk
      - name: Publish rolling test build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete testbuild --cleanup-tag --yes || true
          gh release create testbuild tetra-escape-debug.apk \
            --prerelease \
            --title "Testbygge (senaste från main)" \
            --notes "Automatiskt bygge av commit ${GITHUB_SHA::7}. Signerat med test-nyckeln, går att uppdatera ovanpå tidigare testbyggen."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore (if the secret exists)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > release.keystore; else echo "No release keystore secret – APK will be unsigned"; fi
      - name: Release APK
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release*.apk tetra-escape-${GITHUB_REF_NAME}.apk
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" tetra-escape-${GITHUB_REF_NAME}.apk --title "Tetra-Escape ${GITHUB_REF_NAME}" --generate-notes
